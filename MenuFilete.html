<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú del Restaurante</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="menu.css">
    <script>
        (function initTema() {
            const guardado = localStorage.getItem('filete-tema');
            if (guardado) document.documentElement.setAttribute('data-theme', guardado);
        })();
    </script>
</head>
<body>
    <button class="btn-tema" id="btn-tema" onclick="toggleTema()" title="Cambiar tema">
        <i class="fa-solid fa-moon" id="icono-tema"></i>
        <span id="texto-tema">Oscuro</span>
    </button>

    <div class="contenedor">
        <header class="cabecera-menu">
            <!-- 🔥 TRUCO DE ACCESO: Doble clic en el logo -->
            <div class="logo-box" title="Menú El Filete" ondblclick="window.location.href='login.html'" style="cursor: pointer;">
                <img src="Imagenes/Logo.jpg" alt="Logo El Filete">
            </div>
            <h1>Menú Digital</h1>
            <h2 class="subtitulo-menu">Descubre nuestros deliciosos platillos y especialidades</h2>
        </header>

        <div id="menu-contenedor">
            <div class="loading-state">
                <i class="fa-solid fa-spinner fa-spin"></i> Cargando menú desde la base de datos...
            </div>
        </div>
    </div>

    <script>
        const API_BASE = (window.location.protocol === 'file:') ? 'http://localhost:5000' : '';

        function aplicarTema(tema) {
            document.documentElement.setAttribute('data-theme', tema);
            const icono = document.getElementById('icono-tema');
            const texto = document.getElementById('texto-tema');
            if (icono) icono.className = tema === 'light' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            if (texto) texto.textContent = tema === 'light' ? 'Claro' : 'Oscuro';
            localStorage.setItem('filete-tema', tema);
        }

        function toggleTema() {
            const actual = document.documentElement.getAttribute('data-theme');
            aplicarTema(actual === 'dark' ? 'light' : 'dark');
        }

        (function() {
            const actual = document.documentElement.getAttribute('data-theme');
            aplicarTema(actual);
        })();

        window.addEventListener('storage', (e) => {
            if (e.key === 'filete-tema' && e.newValue) aplicarTema(e.newValue);
        });

        function toggleCategoria(el) { el.closest('.seccion-categoria').classList.toggle('abierta'); }

        async function cargarMenu() {
            const container = document.getElementById('menu-contenedor');
            try {
                const res = await fetch(`${API_BASE}/api/productos`);
                if (!res.ok) throw new Error("Error al consultar productos");
                const productos = await res.json();
                const map = new Map();
                productos.forEach(p => { if (!map.has(p.categoria)) map.set(p.categoria, []); map.get(p.categoria).push(p); });
                
                let html = ''; let primera = true;
                map.forEach((items, categoria) => {
                    html += `
                    <section class="seccion-categoria ${primera ? 'abierta' : ''}">
                        <h2 class="titulo-categoria" onclick="toggleCategoria(this)">
                            <span class="titulo-izq"><i class="fa-solid fa-utensils"></i> ${categoria} <span class="badge-contador">${items.length}</span></span>
                            <i class="fa-solid fa-chevron-down chevron"></i>
                        </h2>
                        <div class="contenido-categoria"><div class="cuadricula">
                            ${items.map(p => `
                                <article class="tarjeta-producto">
                                    <div class="imagen-wrapper">
                                        ${p.imagen_url ? `<img src="${p.imagen_url}" class="imagen-producto" onerror="this.onerror=null; this.src='Imagenes/Logo.jpg';">` : '<i class="fa-solid fa-utensils icono-placeholder"></i>'}
                                    </div>
                                    <div class="contenido-tarjeta">
                                        <h3 class="nombre-producto">${p.nombre}</h3>
                                        <p class="descripcion-producto">${p.descripcion || ''}</p>
                                        <span class="precio">C$ ${p.precio.toFixed(2)}</span>
                                    </div>
                                </article>
                            `).join('')}
                        </div></div>
                    </section>`;
                    primera = false;
                });
                container.innerHTML = html;
            } catch (err) { 
                container.innerHTML = '<div class="loading-state" style="color:#ef4444;">Error al cargar el menú.</div>'; 
            }
        }

        document.addEventListener('DOMContentLoaded', cargarMenu);
    </script>
</body>
</html>
