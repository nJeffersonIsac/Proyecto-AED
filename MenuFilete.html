<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú del Restaurante </title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="menu.css">
</head>
<body>
    <button class="btn-tema" id="btn-tema" onclick="toggleTema()" title="Cambiar tema">
        <i class="fa-solid fa-moon" id="icono-tema"></i>
        <span id="texto-tema">Oscuro</span>
    </button>

    <div class="contenedor">
        <header class="cabecera-menu">
            <div class="logo-box">
                <img src="Imagenes/Logo.jpg" alt="Logo El Filete">
            </div>
            <h1>Menú Digital</h1>
            <h2 class="subtitulo-menu">Descubre nuestros deliciosos platillos y especialidades</h2>
        </header>

        <div id="menu-contenedor">
            <div class="loading-state">
                <i class="fa-solid fa-spinner fa-spin"></i> Cargando menú desde la base de datos...
            </div>
        </div>
    </div>

    <script>
        const API_BASE = (window.location.protocol === 'file:') ? 'http://localhost:5000' : '';

        /* ====== GESTIÓN DE TEMA ====== */
        function aplicarTema(tema) {
            document.documentElement.setAttribute('data-theme', tema);
            const icono = document.getElementById('icono-tema');
            const texto = document.getElementById('texto-tema');
            if (tema === 'light') {
                icono.className = 'fa-solid fa-sun';
                texto.textContent = 'Claro';
            } else {
                icono.className = 'fa-solid fa-moon';
                texto.textContent = 'Oscuro';
            }
            localStorage.setItem('filete-tema', tema);
        }

        function toggleTema() {
            const actual = document.documentElement.getAttribute('data-theme');
            aplicarTema(actual === 'dark' ? 'light' : 'dark');
        }

        (function initTema() {
            const guardado = localStorage.getItem('filete-tema');
            if (guardado) {
                aplicarTema(guardado);
            } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                aplicarTema('light');
            } else {
                aplicarTema('dark');
            }
        })();

        window.addEventListener('storage', (e) => {
            if (e.key === 'filete-tema' && e.newValue) {
                aplicarTema(e.newValue);
            }
        });

        /* ====== ACORDEÓN ====== */
        function toggleCategoria(elementoTitulo) {
            const seccion = elementoTitulo.closest('.seccion-categoria');
            seccion.classList.toggle('abierta');
        }

        /* ====== CARGA DEL MENÚ ====== */
        async function cargarMenu() {
            const container = document.getElementById('menu-contenedor');
            try {
                const res = await fetch(`${API_BASE}/api/productos`);
                if (!res.ok) throw new Error("Error al consultar productos (HTTP " + res.status + ")");
                const productos = await res.json();

                const categoriasMap = new Map();
                productos.forEach(p => {
                    if (!categoriasMap.has(p.categoria)) {
                        categoriasMap.set(p.categoria, []);
                    }
                    categoriasMap.get(p.categoria).push(p);
                });

                let html = '';
                let primeraCategoria = true;

                categoriasMap.forEach((items, categoria) => {
                    const abierta = primeraCategoria ? 'abierta' : '';
                    primeraCategoria = false;

                    html += `
                    <section class="seccion-categoria ${abierta}">
                        <h2 class="titulo-categoria" onclick="toggleCategoria(this)">
                            <span class="titulo-izq">
                                <i class="fa-solid fa-utensils"></i>
                                ${categoria}
                                <span class="badge-contador">${items.length}</span>
                            </span>
                            <i class="fa-solid fa-chevron-down chevron"></i>
                        </h2>
                        <div class="contenido-categoria">
                            <div class="cuadricula">
                                ${items.map(p => `
                                    <article class="tarjeta-producto">
                                        <div class="imagen-wrapper">
                                            ${p.imagen_url
                                                ? `<img src="${p.imagen_url}" alt="${p.nombre}" class="imagen-producto" onerror="this.parentElement.innerHTML='<i class=\\'fa-solid fa-utensils icono-placeholder\\'></i>'">`
                                                : `<i class="fa-solid fa-utensils icono-placeholder"></i>`}
                                        </div>
                                        <div class="contenido-tarjeta">
                                            <h3 class="nombre-producto">${p.nombre}</h3>
                                            <p class="descripcion-producto">${p.descripcion || ''}</p>
                                            <span class="precio">C$ ${p.precio.toFixed(2)}</span>
                                        </div>
                                    </article>
                                `).join('')}
                            </div>
                        </div>
                    </section>
                    `;
                });

                container.innerHTML = html;
            } catch (err) {
                console.error("Error cargando el menú:", err);
                container.innerHTML = `<div class="loading-state" style="color:#ef4444;">Error al cargar el menú desde el servidor.</div>`;
            }
        }

        document.addEventListener('DOMContentLoaded', cargarMenu);
    </script>
</body>
</html>
