<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>El Filete</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Inter', sans-serif; background: #0b0f19; overflow: hidden; }
        [data-theme="light"] body { background: #f1f5f9; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 2rem; background: rgba(11, 15, 25, 0.95); position: fixed; width: 100%; top: 0; z-index: 1000; box-sizing: border-box; border-bottom: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); transition: background 0.35s; }
        [data-theme="light"] .top-nav { background: rgba(255, 255, 255, 0.95); border-bottom: 1px solid rgba(15, 23, 42, 0.1); }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-container img { height: 48px; border-radius: 8px; display: block; }
        .brand-name { color: #f8fafc; font-weight: 700; font-size: 1.1rem; letter-spacing: 1px; }
        [data-theme="light"] .brand-name { color: #0f172a; }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; }
        .nav-links a { color: #dca742; text-decoration: none; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; padding: 8px 16px; border-radius: 8px; transition: 0.3s; cursor: pointer; }
        .nav-links a:hover, .nav-links a.active { color: #fff; background: rgba(220, 167, 66, 0.15); }
        [data-theme="light"] .nav-links a:hover, [data-theme="light"] .nav-links a.active { color: #0f172a; }
        .content-frame { width: 100%; height: 100vh; border: none; padding-top: 65px; box-sizing: border-box; }
        .user-chip { color: #94a3b8; font-size: 0.8rem; padding: 6px 12px; border-left: 1px solid rgba(255,255,255,0.1); }
        [data-theme="light"] .user-chip { border-left: 1px solid rgba(15,23,42,0.1); color: #64748b; }
        .logout { color: #ef4444 !important; cursor: pointer; }
    </style>
</head>
<body>
    <nav class="top-nav">
        <div class="logo-container">
            <img src="Imagenes/Logo.jpg" alt="Logo">
            <span class="brand-name">EL FILETE</span>
        </div>
        <div class="nav-links">
            <a href="MenuFilete.html" target="main-frame" class="active" onclick="setActive(this)">Menú</a>
            <a href="Facturacion.html" target="main-frame" onclick="setActive(this)">Punto de Venta</a>
            <a href="reservas.html" target="main-frame" onclick="setActive(this)">Reservas</a>
            <span class="user-chip" id="user-chip">Cargando...</span>
            <a onclick="window.cerrarSesion()" class="logout">Salir</a>
        </div>
    </nav>
    <iframe name="main-frame" src="MenuFilete.html" class="content-frame"></iframe>

    <script src="login.js"></script>
    <script>
        // Sincronizar tema entre iframes
        window.addEventListener('storage', (e) => {
            if (e.key === 'filete-tema' && e.newValue) {
                document.documentElement.setAttribute('data-theme', e.newValue);
            }
        });
        (function initTema() {
            const guardado = localStorage.getItem('filete-tema');
            if (guardado) document.documentElement.setAttribute('data-theme', guardado);
        })();

        function setActive(el) {
            document.querySelectorAll('.nav-links a').forEach(a => a.classList.remove('active'));
            el.classList.add('active');
        }
        (async function () {
            const u = await window.cargarUsuarioActual();
            if (!u) return;
            const etiquetas = { admin: 'Administrador', cajero: 'Cajero', mesero: 'Mesero' };
            document.getElementById('user-chip').textContent = `${u.nombre_completo} (${etiquetas[u.rol]})`;
        })();
    </script>
</body>
</html>
