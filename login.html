<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Login - El Filete</title>
    <link rel="stylesheet" href="Login.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-card">
        <h1>El Filete</h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 1.5rem;">Sistema de Punto de Venta</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label>Usuario</label>
                <input type="text" id="username" required autocomplete="username">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-login">Iniciar Sesión</button>
            <div id="errorMsg" class="login-error" style="display:none; color:var(--danger); font-size:0.85rem; text-align:center; margin-top:1rem;"></div>
        </form>

        <!-- Enlace para clientes que entraron por error -->
        <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">
            <a href="MenuFilete.html" style="color: var(--primary); text-decoration: none; font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <i class="fa-solid fa-book-open"></i> Ver Menú Digital
            </a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const err = document.getElementById('errorMsg');
            err.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                if (res.ok) {
                    window.location.href = '/unificador.html';
                } else {
                    err.textContent = 'Credenciales incorrectas. Intenta de nuevo.';
                    err.style.display = 'block';
                }
            } catch (e) {
                err.textContent = 'Error de conexión con el servidor.';
                err.style.display = 'block';
            }
        });
    </script>
</body>
</html>
